# roc:temporal — the HOSTED layer (D-T1-1). Primitive: every option is an
# explicit argument, no defaults. The pure-Roc `Temporal` module over this one
# carries the defaults, formatters and parsers.
#
# Value types (PlainDate, PlainTime, Duration) are plain records of ISO fields,
# a Calendar is a tag and a TimeZone is its identifier; ZonedDateTime is the one
# resource (P5). Opt-in per world; the host is the sole vendor of temporal_rs
# (H0c).
#
# LEAF ORDER IS LOAD-BEARING. Glue names a result type after the FIRST leaf that
# declares its shape and reuses that name for every structurally identical one —
# `zdt_with_time_zone!` and `zdt_start_of_day!` both land on
# `TemporalHostZdtFromEpochNsResult` (B7 finding 2). Reordering these entries
# renames host types. Rebuild and re-read abi/src/generated.rs if you must.
module = "TemporalHost"
[[resources]]
name = "ZonedDateTime"
[[hosted]]
leaf = "calendar_from_id!"
symbol_stem = "calendar_from_id"
[[hosted]]
leaf = "calendar_id!"
symbol_stem = "calendar_id"
[[hosted]]
leaf = "time_zone_from_id!"
symbol_stem = "time_zone_from_id"
[[hosted]]
leaf = "date_add!"
symbol_stem = "date_add"
[[hosted]]
leaf = "date_until!"
